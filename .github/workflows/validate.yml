name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validator self-tests
        run: npm test
      - name: Validate skills (frontmatter, names, sections, links, fences, duplicates)
        run: npm run validate
      - name: Installation compatibility (Skills CLI discovers every skill)
        run: |
          expected=$(find skills -mindepth 3 -maxdepth 3 -name SKILL.md | wc -l)
          # Capture first: under the default `bash -eo pipefail`, a non-zero CLI exit or a grep miss
          # would kill the step silently. The count comparison below is the real check.
          out=$(DISABLE_TELEMETRY=1 npx -y skills@1.9.0 add . --list 2>&1 || true)
          echo "$out"
          found=$(printf '%s' "$out" | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' | grep -oE 'Found [0-9]+ skills' | grep -oE '[0-9]+' || true)
          echo "expected=$expected found=$found"
          test "$expected" = "$found"
